name: Gym Tracker live browser tests
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Azure Static Web Apps CI/CD"]
    branches: [main]
    types: [completed]
jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GYM_REQUIRE_LATEST_UI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real-browser test of Azure site
        run: node tests/azure-e2e.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore
