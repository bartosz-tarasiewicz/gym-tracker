name: Gym Tracker live browser tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'storage.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/azure-e2e.mjs'
      - '.github/workflows/gym-tracker-e2e.yml'
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real-browser test of Azure site
        run: node tests/azure-e2e.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore
