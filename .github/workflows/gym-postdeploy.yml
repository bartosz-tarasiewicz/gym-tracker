name: Gym Tracker post-deploy smoke
on:
  workflow_run:
    workflows:
      - Azure Static Web Apps CI/CD
    types: [completed]
    branches: [main]
jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test deployed Gym Tracker
        env:
          GYM_REQUIRE_LATEST_UI: '1'
        run: node tests/azure-e2e.mjs
      - name: Verify cloud API rejects anonymous requests
        run: node tests/azure-api-anonymous.mjs
