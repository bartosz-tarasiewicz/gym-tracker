center;background:#14222bec;backdrop-filter:blur(15px);border-top:1px solid #2c3d45;padding:11px 10px calc(11px + env(safe-area-inset-bottom));z-index:8}.bottom-inner{display:flex;gap:8px;width:min(620px,100%)}.navitem{flex:1;border:0;color:#a9bac4;background:transparent;border-radius:10px;padding:8px;font-size:13px;font-weight:800}.navitem.active{background:#243b3c;color:#7ce6ba}.inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.spacer{height:10px}.label{font-size:12px;font-weight:700;color:#9aadb9;margin:8px 0}.empty{padding:23px;text-align:center;color:#9daebb}.toast{position:fixed;bottom:89px;left:50%;transform:translateX(-50%);background:#67e2ad;color:#0d2920;font-weight:800;border-radius:99px;padding:11px 17px;z-index:20;white-space:nowrap;box-shadow:0 8px 32px #0006}.warning{font-size:12px;background:#3e3329;color:#f3d4a1;padding:11px;border-radius:12px;line-height:1.5}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#22343e;border-radius:12px;padding:13px 10px}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:#9aafbb}.muted-link{color:#8ce8bc;text-decoration:none}.footer{color:#8196a5;text-align:center;font-size:11px;margin:22px 0 8px}.hr{border:0;border-top:1px solid #32434d;margin:16px 0}@media(min-width:650px){.machine-img{height:270px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Calendar: seven tappable columns remain inside the iPhone viewport. */
.calendar-panel{padding:13px 12px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calendar-header strong{font-size:14px}
.calendar-actions{display:flex;gap:4px}
.calendar-actions button{background:#263740;border:1px solid #425461;color:#e0f3ec;border-radius:9px;min-width:32px;height:32px;padding:3px 7px;font-weight:800}
.calendar-month{text-align:center;text-transform:capitalize;color:#bcd0d7;font-size:13px;font-weight:700;margin:12px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendar-weekday{text-align:center;color:#8fa6b4;font-size:11px;font-weight:700;padding:5px 0}
.calendar-blank{min-height:42px}
.calendar-day{min-height:42px;min-width:0;border:1px solid #334751;border-radius:10px;color:#d7e4e7;background:#172832;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.calendar-day.has-workout{border-color:#54b58e;background:#213d38;font-weight:800}
.calendar-day.selected{background:#64dca9;border-color:#64dca9;color:#0e241b}
.calendar-day small{font-size:10px;line-height:1;color:inherit;opacity:.8}
.calendar-day.has-workout:not(.selected) small{color:#86f2bf}
.calendar-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;min-height:26px}
.calendar-key{font-size:11px;color:#a8bac6}
.calendar-key i{display:inline-block;width:8px;height:8px;background:#64dca9;border-radius:50%;margin-right:4px}
.history-edit-button{margin:6px 0 8px}
.history-details{margin-top:5px}
.history-details summary{font-size:12px;color:#92ddba;cursor:pointer;padding:6px 0}
.history-report{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 system-ui;color:#b9d0d7;max-height:420px;overflow:auto}
.history-editor-actions{margin-bottom:9px}
.history-date-field{width:100%;color:#ebf3f5;background:#101d26;border:1px solid #425562;border-radius:10px;padding:10px}
.history-editor .history-exercise-tabs{display:flex;gap:5px;overflow:auto;padding:6px 0 13px}
.history-editor .history-exercise-tabs .tab{min-width:40px;padding:9px 11px}
.history-variant-tabs{display:flex;gap:6px;flex-wrap:wrap}
.history-editor .section-header{margin-top:20px;margin-bottom:7px}
.history-editor .set-row{grid-template-columns:38px minmax(0,1fr) minmax(0,1fr) 38px;gap:5px}
.history-editor .set-row input{font-size:16px}
.history-notes{width:100%;min-height:100px;border:1px solid #415461;border-radius:12px;background:#111e26;color:#f6f7fa;padding:12px}

/* v0.5: Date-first training. One row of seven touch targets on mobile. */
.week-panel{padding:12px;margin:12px 0 5px;border-radius:15px}
.week-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.week-top strong{font-size:13px;display:block;margin-top:5px}
.week-actions{display:flex;gap:4px}
.week-actions button{min-width:34px;height:34px;border:1px solid #425862;background:#263742;color:#edfaf6;border-radius:9px;font-size:18px}
.week-actions button:nth-child(2){font-size:12px;padding:2px 7px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.week-day{min-width:0;min-height:66px;padding:7px 2px;border:1px solid #39505b;border-radius:10px;background:#21313b;color:#d7e6ec;display:flex;flex-direction:column;align-items:center;gap:3px}
.week-day.active{background:#64dca9;border-color:#64dca9;color:#0b271d;font-weight:800}
.week-name{font-size:10px;font-weight:700}
.week-number{font-size:18px;font-weight:800;line-height:1.1}
.week-dot{font-size:11px;color:#60dba2;line-height:8px;min-height:8px}
.week-day.active .week-dot{color:#155a42}
.week-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:#a0bac5}
.week-bottom label{display:flex;align-items:center;gap:5px}
.week-bottom input{background:#12232d;border:1px solid #3e515b;border-radius:7px;padding:5px;color:#e6f4f0;font-size:11px;max-width:116px}
.week-dot-legend{color:#60dba2}
.compact-hero{padding:10px 0 4px}
.compact-hero h1{font-size:24px}
.workout-overview{margin:9px 0;padding:12px}
.exercise-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scroll-snap-type:x mandatory}
.exercise-tab{scroll-snap-align:start;flex:0 0 auto;max-width:155px;min-width:97px;background:#22343e;border:1px solid #425562;border-radius:11px;color:#d5e4ea;padding:9px;display:flex;align-items:flex-start;flex-direction:column;gap:3px;text-align:left;font-size:12px;line-height:1.25}
.exercise-tab.active{border-color:#66dbaa;background:#245146}
.exercise-tab small{font-size:10px;color:#85ebb8}
.machine-options{display:flex;gap:6px;overflow-x:auto;padding:7px 0;scroll-snap-type:x mandatory}
.machine-choice{scroll-snap-align:start;flex:0 0 auto;border:1px solid #415662;background:#23333e;color:#e5f1f4;padding:9px 10px;border-radius:10px;font-size:12px;font-weight:700}
.machine-choice.active{border-color:#64dca9;color:#baf9df;background:#245147}
.machine-choice:focus-visible,.week-day:focus-visible{outline:2px solid #67e6b5;outline-offset:2px}
.previous-results{background:#1c3735;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;color:#d8f6e9;font-size:12px;margin-top:8px}
.previous-results span{color:#a8ddc8;line-height:1.5}
.nudge-wrap{display:flex;align-items:center;min-width:0;gap:2px}
.nudge-wrap input{min-width:0;flex:1;padding:12px 0;font-size:15px}
.nudge-wrap button{flex:0 0 24px;min-width:24px;height:41px;padding:0;background:#2d4049;color:#ccf3e5;border:1px solid #415661;border-radius:8px;font-size:16px}
.set-row{grid-template-columns:24px minmax(0,1fr) minmax(0,1.65fr) 36px;gap:5px}
.set-row input{font-size:15px}
.done-button{height:41px;border-radius:9px}
.set-head{grid-template-columns:24px minmax(0,1fr) minmax(0,1.65fr) 36px;gap:5px}
.notes{width:100%;min-height:100px;background:#111e26;color:#f2faf8;border:1px solid #415661;padding:11px;border-radius:11px}
.img-link{display:block;text-align:center;line-height:1.3;overflow-wrap:anywhere}
.trend-filter .equipment{margin-top:3px}
.trend-filter-row{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.trend-segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.trend-segment{background:#243641;color:#d3e4ed;border:1px solid #425864;padding:10px 5px;font-size:11px;font-weight:700;border-radius:9px}
.trend-segment.active{background:#64dca9;border-color:#64dca9;color:#10251c}
#trend-range{align-self:flex-end;background:#1a2b36;color:#e1f0f4;padding:7px;border:1px solid #425660;border-radius:9px}
.trend-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:13px 0}
.trend-stats>div{padding:10px 7px;border:1px solid #344c54;background:#1f323b;border-radius:10px;min-width:0}
.trend-stats span{display:block;font-size:10px;color:#a7bdc6}
.trend-stats strong{display:block;font-size:15px;overflow-wrap:anywhere;margin-top:7px}
.trend-chart{width:100%;height:auto;display:block;overflow:visible}
.trend-line{stroke:#61dca9;stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.trend-point{fill:#65e3af;stroke:#133b2b;stroke-width:1.5}
.trend-grid{stroke:#334751;stroke-width:1}
.trend-axis{font-size:10px;fill:#9bb5c2}
.trend-empty{padding:27px 10px;text-align:center;color:#b8d3c9}
.trend-history>div{display:grid;grid-template-columns:1fr auto;gap:3px;border-bottom:1px solid #344750;padding:10px 0;font-size:13px}
.trend-history>div:last-child{border-bottom:0}
.trend-history strong{font-size:14px}
.trend-history small{grid-column:1/-1;color:#91abbb;font-size:11px}
@media(max-width:380px){.shell{padding-left:11px;padding-right:11px}.week-panel{padding:10px 8px}.week-grid{gap:3px}.nudge-wrap button{flex-basis:21px;min-width:21px}.set-row{gap:3px}.set-row input{padding-left:3px;padding-right:3px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">ZENEK<span> / GYM</span></div><div style="text-align:right"><div id="today" class="chip"></div><span id="storage-status" class="status">Wczytywanie danych…</span></div></header><main id="app"></main><div class="footer">Offline + IndexedDB · Gym Tracker v0.4 · Azure Primary</div></div><nav class="bottomnav"><div class="bottom-inner"><button class="navitem active" data-view="train">🏋️ Trening</button><button class="navitem" data-view="history">📈 Historia</button><button class="navitem" data-view="settings">⚙️ Dane</button></div></nav><div id="toast" style="display:none" class="toast"></div><script src="storage.js"></script><script src="sync.js"></script><script src="week-ui.js"></script><script src="progress-ui.js"></script><script src="app.js"></script></body></html>
